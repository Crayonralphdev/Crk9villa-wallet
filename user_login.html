<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f7fb; margin:0; display:flex; justify-content:center; align-items:center; height:100vh; }
.container { background:white; padding:30px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width:90%; max-width:400px; }
h2 { text-align:center; margin-bottom:20px; }
input { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; }
button { width:100%; padding:10px; margin-top:10px; background:#1877f2; color:white; border:none; border-radius:10px; cursor:pointer; }
p { text-align:center; margin-top:10px; }
a { color:#1877f2; text-decoration:none; }
</style>
</head>
<body>
<div class="container">
<h2>User Login</h2>
<input type="text" id="loginCode" placeholder="Enter your 4-digit code">
<button onclick="login()">Login</button>
<p>Don't have an account? <a href="user_registration.html">Sign Up</a></p>
</div>

<script>
function login() {
  let code = document.getElementById("loginCode").value.trim();
  if(!code) return alert("Enter your code");

  let users = JSON.parse(localStorage.getItem("users")) || [];
  let user = users.find(u => u.code === code);
  if(!user) return alert("User not found");

  localStorage.setItem("currentUser", JSON.stringify(user));
  window.location.href = "user_dashboard.html";
}
</script>
</body>
</html>
